<!doctype html>
{% load static %}

<html lang="en">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

        <style>
            /* ---------- Coffee Hut design tokens (matches all pages built on this base) ---------- */
            @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Work+Sans:wght@400;500;600;700&display=swap');

            :root {
                --espresso: #2b1a12;
                --roast: #5c3a21;
                --cream: #fbf4e6;
                --cream-deep: #f2e5cd;
                --caramel: #c68b3d;
                --caramel-dark: #a86f28;
            }

            body {
                font-family: 'Work Sans', sans-serif;
                background: var(--cream);
            }

            /* Scoped to "nav.navbar" so nothing here touches the page-content
               .container elements that live outside the nav (coffee.html,
               fri.html, etc. each define their own .ch-menu-wrap container). */
            nav.navbar.bg-light {
                background-color: var(--cream-deep) !important;
                border-bottom: 3px solid var(--caramel);
                box-shadow: 0 6px 18px -10px rgba(43,26,18,0.35);
                padding: 10px 0;
            }

            nav.navbar .navbar-brand {
                font-family: 'Fraunces', serif;
                font-weight: 900;
                font-size: 26px;
                letter-spacing: 1px;
                color: var(--espresso) !important;
            }

            nav.navbar .navbar-nav .nav-link {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 6px 14px !important;
                border-radius: 12px;
                transition: background-color .2s ease, transform .2s ease;
            }

            nav.navbar .navbar-nav .nav-link:hover {
                background-color: rgba(198,139,61,0.18);
                transform: translateY(-2px);
            }

            nav.navbar .navbar-nav .nav-link img {
                transition: transform .2s ease;
            }

            nav.navbar .navbar-nav .nav-link:hover img {
                transform: scale(1.08);
            }

            nav.navbar .navbar-toggler {
                border-color: var(--caramel);
            }

            nav.navbar .btn-outline-success {
                border-color: var(--espresso);
                color: var(--espresso);
                border-radius: 10px;
                font-weight: 600;
                transition: background-color .2s ease, color .2s ease;
            }

            nav.navbar .btn-outline-success:hover {
                background-color: var(--espresso);
            }

            nav.navbar .btn-outline-success:hover .nav-link {
                color: white !important;
            }

            nav.navbar .btn-outline-success .nav-link {
                padding: 0 !important;
                display: inline;
            }

            /* Toast messages, reskinned to match the brand instead of Bootstrap's
               default green - only affects .toast, which is unique to this
               base template's flash-message markup. */
            .toast.bg-success {
                background-color: var(--espresso) !important;
                border-left: 4px solid var(--caramel) !important;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <nav
                class="navbar navbar-expand-sm navbar-light bg-light">           
                <div class="container">
                    <a class="navbar-brand text-black" href="#">
                        <img src="{% static 'images/cafe_logo_transparent.png' %}" alt="Company Name Logo" width="90" height="90">
                        MENU</a>    
                    <button
                        class="navbar-toggler d-lg-none"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapsibleNavId"
                        aria-controls="collapsibleNavId"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="collapsibleNavId">
                        <ul class="navbar-nav me-auto mt-2 mt-lg-0 mx-auto">
                            <li class="nav-item">
                                <a class="nav-link active text-black" href='{% url "coffee_page" %}' aria-current="page">
                                    <img src="{% static 'images/coffee.svg' %}"  width="50" height="50" >
                                    <span class="visually-hidden">(current)</span></a >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active text-black" href='{% url "fri_page" %}' aria-current="page">
                                    <img src="{% static 'images/frilogo.svg' %}"  width="40" height="40" >
                                    <span class="visually-hidden">(current)</span></a >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active text-black" href='{% url "sandwich_page" %}' aria-current="page">
                                    <img src="{% static 'images/sand.svg' %}"  width="50" height="50" >
                                    <span class="visually-hidden">(current)</span></a >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-black" href='{% url "wrap_page" %}'>
                                    <img src="{% static 'images/wrap.png' %}"  width="50" height="50" >
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-black" href='{% url "baked_page" %}'>
                                    <img src="{% static 'images/combine.svg' %}"  width="50" height="50" >
                                </a>
                            </li>
                            
                        </ul>

                        <button
                                class="btn btn-outline-success my-2 my-sm-0"
                                type="submit">
                                <a class="nav-link text-black" href='{% url "home_page" %}'>Back</a>
                                
                            </button>
                    </div>
                </div>
            </nav>
            
        </div>

        <!-- Toast popup for messages -->
{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080">
    {% for message in messages %}
    <div class="toast align-items-center text-white bg-success border-0 show" role="alert" id="toast-{{ forloop.counter }}">
        <div class="d-flex">
            <div class="toast-body">
                {{ message }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
    {% endfor %}
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var toastElList = document.querySelectorAll('.toast');
        toastElList.forEach(function (toastEl) {
            var toast = new bootstrap.Toast(toastEl, { delay: 2500 });
            toast.show();
            setTimeout(function() {
                toastEl.remove();
            }, 3000);
        });
    });
</script>
{% endif %}
        {% block content %}

        {% endblock content %}

        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
