{% extends "adminpanel.html" %}
{% block content %}
        <div class="col-lg-8 mx-auto my-5">
            <div class="card">
                <div class="card-header bg-danger">
                    <h5 class="text-white text-center">Update Data</h5>
                </div>
                <div class="card-body">
                    {% if item %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-floating mb-3">
                            <input
                                type="text"
                                class="form-control"
                                name="item_name"
                                id="formId1"
                                value="{{ item.item_name }}"
                                placeholder=""
                            />
                            <label for="formId1">Item Name</label>
                        </div>
                        <div class="form-floating mb-3">
    <select class="form-select" name="item_category">

        {% for category in categories %}
            <option value="{{ category.id }}"
                {% if category.id == item.item_category.id %}
                    selected
                {% endif %}
            >
                {{ category.name }}
            </option>
        {% endfor %}

    </select>

    <label>Item Category</label>
</div>

                        <div class="form-floating mb-3">
                            <input
                                type="text"
                                class="form-control"
                                name="item_description"
                                id="formId1"
                                value="{{ item.item_description }}"
                                placeholder=""
                            />
                            <label for="formId1">Item Description</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input
                                type="number"
                                class="form-control"
                                name="item_price"
                                id="formId1"
                                value="{{ item.item_price }}"
                                placeholder=""
                            />
                            <label for="formId1">Item Price</label>
                        </div>
                        <div class="form-floating mb-3">
                        <div class="form-floating mb-3">
    <select class="form-select" name="item_available">
        <option value="True"
            {% if item.item_available %}
                selected
            {% endif %}
        >
            Available
        </option>

        <option value="False"
            {% if not item.item_available %}
                selected
            {% endif %}
        >
            Not Available
        </option>
    </select>

    <label>Item Available</label>
</div>

                        <div class="d-grid gap-2">
                            <button
                                type="submit"
                                class="btn btn-danger"
                            >
                                Update Data
                            </button>
                        </div>
                        
                    </form>
                    {% endif %}
                </div>
            </div>
        </div>
{% endblock content %}
