<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #422e11;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 400px;
            padding: 40px;
            background: #825e41;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: #2b2638;
            border: 1px solid #7b5cff;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: #6a4ee6;
        }

        .password-box {
            position: relative;
        }

        .eye {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #7b5cff;
        }

        .signin {
            width: 100%;
            padding: 14px;
            background: #7b5cff;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .signin:hover {
            background: #6a4ee6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sign In</h1>
        {% if messages %}
            {% for message in messages %}
                <p style="color: {% if message.tags == 'error' %}red{% else %}green{% endif %}; text-align: center;">{{ message }}</p>
            {% endfor %}
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="form-group password-box">
                <input type="password" name="password" placeholder="Enter your password" id="password" required>
                <span class="eye" onclick="togglePassword()">👁</span>
            </div>
            <button type="submit" class="signin">Sign In</button>
        </form>
    </div>

    <script>
        function togglePassword() {
            const passwordField = document.getElementById("password");
            if (passwordField.type === "password") {
                passwordField.type = "text";
            } else {
                passwordField.type = "password";
            }
        }

        function handleSubmit(event) {
            // event.preventDefault(); // Prevent default form submission
            
            // Get form data
            const form = document.getElementById('signinForm');
            const formData = new FormData(form);
            
            // Create object to store data
            const signinData = {
                email: formData.get('email'),
                password: formData.get('password'),
                timestamp: new Date().toLocaleString()
            };
            
            // Store data in localStorage
            const storedData = JSON.parse(localStorage.getItem('signinHistory')) || [];
            storedData.push(signinData);
            localStorage.setItem('signinHistory', JSON.stringify(storedData));
            
            // Show success message
            alert(`Sign In successful!\nData saved: ${signinData.email}`);
            
            // Clear all form fields
            form.reset();
        }
    </script>
</body>
</html>
