{% extends "adminpanel.html" %}

{% block content %}

<!doctype html>
<html lang="en">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <style>
        </style>
    </head>

    <body>
        <div class="container">
            <nav
                class="navbar navbar-expand-sm navbar-light bg-dark"
            >
                <div class="container">
                    <button
                        class="navbar-toggler d-lg-none"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#collapsibleNavId"
                        aria-controls="collapsibleNavId"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    </div> 
                </div>
            </nav>
            
        </div>


        <div class="container">
            <div class="col-lg-12 mx-auto my-5">
                <div class="card">
                    <div class="card-header bg-danger">
                        <h5 class="text-white text-center">CATEGORY</h5>
                    </div>
                    <div class="card-body">
                        <tr>
                            <a class="btn btn-primary" href="{% url 'category_add' %}">Add</a>
                        </tr>
                        <div
                            class="table-responsive"
                        >
                            <table
                                class="table table-primary"
                            >
                                <thead>
                                    <tr>
                                        <th>id</th>
                                        <th>category</th>
                                        <th> Action </th>
                                        <th> </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% if cates %}
                                        {% for cate in cates %}
                                        <tr class="">
                                            <td>{{ cate.id }}</td>
                                            <td>{{ cate.name }}</td>
                                            <td>
                                                <a class="btn btn-success" href="/update1/{{cate.id}}">Update</a>
                                            </td>
                                            <td>
                                                <a class="btn btn-danger" href="/delete1/{{cate.id}}">Delete</a>
                                            </td>
                                        </tr>
                                        {% endfor %}
                                       

                                        
                                    {% endif %}
                        
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    </html>
    {% endblock content %}
