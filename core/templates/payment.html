{% extends "base.html" %}
{% block content %}
{% load static %}

<div class="container mt-5">
    <h2>Payment</h2>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Order #{{ order.id }}</h5>
            <p>Total to pay: <strong>${{ order.total_amount }}</strong></p>
        </div>
    </div>

    <!-- Placeholder payment form — swap for real gateway (Razorpay/Stripe) -->
    <form method="POST" action="{% url 'confirm_payment' order.id %}">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Card Number</label>
            <input type="text" class="form-control" placeholder="4242 4242 4242 4242" required>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Expiry</label>
                <input type="text" class="form-control" placeholder="MM/YY" required>
            </div>
            <div class="col">
                <label class="form-label">CVV</label>
                <input type="text" class="form-control" placeholder="123" required>
            </div>
        </div>
        <button class="btn btn-success" type="submit">Pay ${{ order.total_amount }}</button>
    </form>
</div>
{% endblock %}
