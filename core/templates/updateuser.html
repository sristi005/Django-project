{% extends "adminpanel.html" %}
{% block content %}
        <div class="col-lg-8 mx-auto my-5">
            <div class="card">
                <div class="card-header bg-danger">
                    <h5 class="text-white text-center">Update Data</h5>
                </div>
                <div class="card-body">
                    {% if login %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="form-floating mb-3">
                            <input
                                type="text"
                                class="form-control"
                                name="first_name"
                                id="formId1"
                                value="{{ login.first_name }}"
                                placeholder=""
                            />
                            <label for="formId1">First Name</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input
                                type="text"
                                class="form-control"
                                name="last_name"
                                id="formId1"
                                value="{{ login.last_name }}"
                                placeholder=""
                            />
                            <label for="formId1">Last Name</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                id="formId1"
                                value="{{ login.email }}"
                                placeholder=""
                            />
                            <label for="formId1">Email</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                id="formId1"
                                value="{{ login.password }}"
                                placeholder=""
                            />
                            <label for="formId1">Password</label>
                        </div>
                        <div class="d-grid gap-2">
                            <button
                                type="submit"
                                class="btn btn-danger"
                            >
                                Update Data
                            </button>
                        </div>
                        
                    </form>
                    {% endif %}
                </div>
            </div>
        </div>
{% endblock content %}
