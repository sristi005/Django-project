<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Popup</title>
    <style>
        /* Trigger Button Styling */
        .trigger-btn {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Dark Background Overlay */
        .popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Popup Box */
        .popup-box {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transform: scale(0.8);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 90%;
        }

        /* Success Icon Circle */
        .success-icon {
            width: 50px;
            height: 50px;
            background-color: #d4edda;
            color: #28a745;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin: 0 auto 15px;
        }

        .popup-box h2 {
            margin: 0 0 10px;
            color: #333;
        }

        .popup-box p {
            color: #666;
            margin: 0 0 20px;
        }

        /* Close Button */
        .close-btn {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        /* Active State Classes */
        .popup-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .popup-overlay.active .popup-box {
            transform: scale(1);
        }
    </style>
</head>
<body>

    <!-- Action Button -->
    <button class="trigger-btn" onclick="togglePopup()">Submit Form</button>

    <!-- Popup Markup -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <div class="success-icon">✓</div>
            <h2>Success!</h2>
            <p>Your action has been completed successfully.</p>
            <button class="close-btn" onclick="togglePopup()">Continue</button>
        </div>
    </div>

    <!-- JavaScript Control -->
    <script>
        function togglePopup() {
            const overlay = document.getElementById('popupOverlay');
            overlay.classList.toggle('active');
        }
    </script>

</body>
</html>
